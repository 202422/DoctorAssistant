[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doctor-assistant"
version = "1.0.0"
description = "Multi-Agent Medical System for symptom analysis and diagnosis using LangGraph"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "Harold COMPAORE", email = "haroldcompaore07@gmail.com"}
]
keywords = [
    "langgraph",
    "langchain",
    "multi-agent",
    "medical",
    "ai",
    "diagnosis",
    "pharmacy",
    "pharmacies",
    "nearby pharmacy"    
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core LLM & Agent Framework
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    "langgraph>=0.2.0",

    # Vector Stores & Embeddings
    "chromadb>=0.5.0",
    "faiss-cpu>=1.8.0",

    # MCP (Model Context Protocol)
    "mcp>=1.0.0",
    "langchain-mcp-adapters>=0.1.0",

    # Database Clients
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.29.0",
    "sqlalchemy>=2.0.0",

    # Configuration & Validation
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",

    # HTTP & API Clients
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
    "requests>=2.31.0",

    # Web UI
    "gradio>=5.0.0",

    # CLI Interface
    "typer[all]>=0.12.0",
    "rich>=13.7.0",

    # Utilities
    "tenacity>=8.2.0",
    "structlog>=24.1.0",

    # Data Processing
    "numpy>=1.26.0",
    "pandas>=2.2.0",

    # Async Support
    "anyio>=4.3.0",
    "nest_asyncio",

    # PDF & Embeddings
    "pypdf",
    "langchain_huggingface",
    "sentence-transformers",

    # Location Services
    "openlocationcode",
    "geopy",

    # Visualization
    "matplotlib>=3.8.0",
    "pillow>=10.2.0",

    # Tracing
    "langsmith>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-env>=1.1.0",
    "respx>=0.21.0",
    "faker>=24.0.0",
    "black>=24.2.0",
    "isort>=5.13.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "ruff>=0.3.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
]

[project.scripts]
doctor-assistant = "doctor_assistant.app:main"

[project.urls]
Homepage = "https://github.com/202422/DoctorAssistant"
Repository = "https://github.com/202422/DoctorAssistant"
Documentation = "https://github.com/202422/DoctorAssistant#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
doctor_assistant = ["*.json", "*.pdf"]

# ============================================
# Tool Configurations
# ============================================

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.venv
    | \.doctor_venv
    | __pycache__
    | build
    | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip = [".git", ".venv", ".doctor_venv", "__pycache__"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".git", ".venv", ".doctor_venv", "__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
